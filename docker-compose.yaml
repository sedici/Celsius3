version: "3"

services:

    apache:
        build: docker/apache/
        ports: [ "80:80" ]
        volumes:
            - .:/var/www/html
        networks:
            - backend
            - frontend
        depends_on:
            - php

    php:
        build:
            context: docker/php/
            args:
                - USERID=1000
                - USERNAME=root
        volumes:
            - .:/var/www/html
        networks:
            - backend
        depends_on:
            - bd
            - elasticsearch
#        command: bash -c "composer install && php-fpm"
    bd:
        image: mysql:8.0
        command:
            - --default-authentication-plugin=mysql_native_password
#        ports: [ "3308:3306" ]
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: celsius3
        volumes:
            - bd:/var/lib/mysql
            - ./docker/bd:/docker-entrypoint-initdb.d
        networks:
            - backend

    node:
        image: node:16
        user: node
        working_dir: /home/node/app
        volumes:
            - ./:/home/node/app
        command: bash -c "npm install && npm run watch"

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.10.2-arm64
        environment:
            - discovery.type=single-node
            - network.host=0.0.0.0
            - http.port=9200
        ports: [ "9200:9200" ]
        networks:
            - backend
        volumes:
            - elasticsearch:/usr/share/elasticsearch/data

    #    redis:
    #        image: redis:alpine
    #        container_name: celsius3_redis
    #        network_mode: host
    #        volumes:
    #          - c3redis:/data

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        ports: [ "81:80" ]
        environment:
            PMA_HOST: "bd"
            PMA_PORT: "3306"
            PMA_USER: "root"
            PMA_PASSWORD: "root"
        depends_on:
            - bd
        networks:
            - backend

    mailer:
        image: schickling/mailcatcher
        ports: [ "1025", "1080" ]

networks:
    backend: ~
    frontend: ~

volumes:
    bd: ~
    elasticsearch: ~
